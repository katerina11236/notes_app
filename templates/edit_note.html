{% extends "base.html" %}

{% block content %}
<h2>Редактировать заметку</h2>
<form method="POST" enctype="multipart/form-data">
    <div class="form-group">
        <label for="title">Заголовок:</label>
        <input type="text" id="title" name="title" value="{{ note.title }}" required>
    </div>
    <div class="form-group">
        <label for="content">Содержание:</label>
        <textarea id="content" name="content" required>{{ note.content }}</textarea>
    </div>
    <div class="form-group">
        <label for="image">Изображение:</label>
        {% if note.image %}
            <div>
                <img src="{{ url_for('static', filename='uploads/' + note.image) }}" style="max-width: 200px;">
                <a href="{{ url_for('delete_image', id=note.id) }}" class="btn btn-danger">Удалить изображение</a>
            </div>
        {% endif %}
        <input type="file" id="image" name="image" accept="image/*">
    </div>
    <button type="submit">Сохранить изменения</button>
    <a href="{{ url_for('view_note', id=note.id) }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
