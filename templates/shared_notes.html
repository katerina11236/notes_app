{% extends "base.html" %}

{% block content %}
<h2>Заметки, доступные мне</h2>

<div class="list-group">
    {% for share in shared_notes %}
    <a href="{{ url_for('view_note', id=share.note.id) }}" class="list-group-item list-group-item-action">
        <div class="d-flex w-100 justify-content-between">
            <h5 class="mb-1">{{ share.note.title }}</h5>
            <small>От {{ share.note.author.username }}</small>
        </div>
        <p class="mb-1">{{ share.note.content[:100] }}...</p>
        {% if share.can_edit %}
        <span class="badge bg-success">Можно редактировать</span>
        {% endif %}
    </a>
    {% endfor %}
</div>
{% endblock %}
