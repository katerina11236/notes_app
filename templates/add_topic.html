{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Добавить тему</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="name" class="form-label">Название темы</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <button type="submit" class="btn btn-primary">Создать</button>
        <a href="{{ url_for('list_topics') }}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
